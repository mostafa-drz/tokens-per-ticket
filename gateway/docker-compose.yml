# Local LiteLLM gateway with Postgres, so spend is stored and queryable.
#
#   cp gateway/.env.example gateway/.env   # then fill in keys
#   docker compose -f gateway/docker-compose.yml up -d
#
# Based on LiteLLM's own compose file and deploy guide:
# https://docs.litellm.ai/docs/proxy/deploy
# Pin the image: LiteLLM recommends a fixed tag over moving tags so
# rollbacks are deterministic. v1.100.1 has the pieces this repo relies on:
# x-litellm-tags merged before budget checks, the LiteLLM_DailyTagSpend
# table, and x-<vendor>-session-id auto-detection.

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.100.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
