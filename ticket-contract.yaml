# The ticket contract: how a git branch maps to a ticket, and how that
# ticket shows up as a spend tag in LiteLLM.
#
# This is the one file a team edits to adopt the repo. The code reads it;
# nothing about Linear, team keys, or branch shape is hard-coded.

# Where `pnpm ticket:report --post` writes. Only "linear" is supported; set
# anything else (e.g. jira) and --post refuses instead of querying Linear.
tracker: linear

key:
  # A ticket key as your tracker prints it. Linear: ENG-123. Jira: PROJ-42.
  pattern: "[A-Z][A-Z0-9]*-[0-9]+"
  # Optional allowlist of team prefixes. Empty means any team.
  teams: []

branch:
  # Used by `pnpm ticket:start` to name new branches.
  # {user} = git user slug, {key} = lowercased ticket key, {KEY} = ticket key
  # as printed (use it for Jira, which only links uppercase keys),
  # {slug} = short title (optional; dropped with its separator when empty).
  # The default matches Linear's "Copy git branch name" format.
  # Jira-style example: "feature/{KEY}_{slug}" -> feature/PROJ-42_short-title
  template: "{user}/{key}-{slug}"

tag:
  # Every model call made while working on ENG-123 carries the tag
  # "ticket:ENG-123". LiteLLM aggregates spend per tag.
  prefix: "ticket:"

worktree:
  # One worktree per ticket keeps one Claude Code session on one ticket.
  # {repo} = this repository's folder name, {branch} = branch with / -> __
  path: "../{repo}.worktrees/{branch}"
