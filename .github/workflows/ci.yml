name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: The CLI entry points start
        run: pnpm -s tpt help && pnpm -s ticket:report --help && pnpm -s ticket:start --help
      - run: pnpm test:registry
      - run: pnpm test:gateway
      - name: The committed CLI bundle matches the source
        run: pnpm build:cli && git diff --exit-code .tokens-per-ticket/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
