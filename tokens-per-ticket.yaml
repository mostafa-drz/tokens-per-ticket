# tokens-per-ticket: how a git branch maps to a ticket, how that ticket shows
# up as a spend tag in LiteLLM, and what runs automatically.
#
# This is the one file a team edits to adopt it. The code reads it; nothing
# about Linear, team keys, or branch shape is hard-coded.

# Where `report --post` writes: "linear" or "jira" (Jira Cloud). Anything
# else: run the report without --post and paste it into your tracker.
tracker: linear

key:
  # A ticket key as your tracker prints it. Linear: ENG-123. Jira: PROJ-42.
  pattern: "[A-Z][A-Z0-9]*-[0-9]+"
  # Optional allowlist of team prefixes. Empty means any team.
  teams: []

branch:
  # Used by `tpt start` to name new branches.
  # {user} = git user slug, {key} = lowercased ticket key, {KEY} = ticket key
  # as printed (use it for Jira, which only links uppercase keys),
  # {slug} = short title (optional; dropped with its separator when empty).
  # The default matches Linear's "Copy git branch name" format.
  # Jira-style example: "feature/{KEY}_{slug}" -> feature/PROJ-42_short-title
  template: "{user}/{key}-{slug}"

tag:
  # Every model call made while working on ENG-123 carries the tag
  # "ticket:ENG-123". LiteLLM aggregates spend per tag.
  prefix: "ticket:"

worktree:
  # One worktree per ticket keeps one Claude Code session on one ticket.
  # {repo} = this repository's folder name, {branch} = branch with / -> __
  path: "../{repo}.worktrees/{branch}"

automation:
  # Claude Code hooks tell the session registry which branch (and ticket) each
  # session is on: at start, before each prompt, and whenever .git/HEAD moves.
  # The gateway then tags every model call with that ticket. Engineers run
  # nothing; switching branches mid-session is followed.
  sessions: true
  # The registry next to your LiteLLM gateway (gateway/docker-compose.yml runs
  # one on :4100). Hooks send the engineer's gateway key here, so use HTTPS
  # outside localhost. TPT_REGISTRY_URL in Claude Code settings overrides it.
  registry_url: "http://localhost:4100"
  # Adds "Ticket: ENG-123" to commit messages on ticket branches, so a commit
  # or PR can be traced back to its ticket. Set to false to turn off.
  commit_trailer: "Ticket"
  # Your deployed ledger. Engineers without the spend-reading key get this link
  # from `tpt report` and /ticket-cost instead of an error.
  # ledger_url: "https://tokens.your-company.dev"
